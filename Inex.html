<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Bar & Ma Cave</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{display:none}.tab.on{display:block}
body.guest .owner{display:none!important}
body:not(.guest) .guest-only{display:none!important}
#interactive video,#interactive canvas{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
</style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen pb-16">
<header class="bg-stone-900 border-b border-stone-800 sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
  <h1 class="text-lg font-bold text-amber-500">🍾 Mon Bar & Ma Cave</h1>
  <button onclick="toggleMode()" id="mode-btn" class="bg-amber-600/20 text-amber-400 border border-amber-500/30 text-xs px-3 py-1.5 rounded-full">🛡️ Propriétaire</button>
</header>
<nav class="bg-stone-900 border-b border-stone-800 flex justify-around text-xs sticky top-[53px] z-30">
  <button onclick="tab('bar')" id="n-bar" class="py-2 px-3">🍸<br>Bar</button>
  <button onclick="tab('cave')" id="n-cave" class="py-2 px-3">🍷<br>Cave</button>
  <button onclick="tab('repas')" id="n-repas" class="py-2 px-3">🍽️<br>Repas</button>
  <button onclick="tab('qr')" id="n-qr" class="py-2 px-3">📱<br>QR & Commandes</button>
</nav>

<main class="max-w-3xl mx-auto p-4">
  <div class="guest-only bg-amber-950/40 border border-amber-800/50 rounded-xl p-3 mb-4 text-xs">
    <label class="block text-amber-300 mb-1">Bienvenue ! Votre prénom pour commander :</label>
    <input id="guest-name" class="w-full bg-stone-950 border border-stone-800 rounded-lg p-2 text-sm" placeholder="Prénom">
  </div>

  <section id="t-bar" class="tab on space-y-3">
    <div class="owner flex justify-between items-center bg-stone-900 p-3 rounded-xl border border-stone-800">
      <span class="text-sm font-bold">Alcools & liqueurs</span>
      <div class="flex gap-2">
        <button onclick="openScanner('bar')" class="bg-stone-800 text-amber-400 border border-stone-700 px-3 py-2 rounded-lg text-xs">📷 Scanner</button>
        <button onclick="openModal('bar')" class="bg-amber-600 text-stone-950 px-3 py-2 rounded-lg text-xs font-bold">+ Ajouter</button>
      </div>
    </div>
    <div id="bar-filters" class="flex gap-2 overflow-x-auto text-xs"></div>
    <div id="bar-list" class="grid sm:grid-cols-2 gap-3"></div>
  </section>

  <section id="t-cave" class="tab space-y-3">
    <div class="owner flex justify-between items-center bg-stone-900 p-3 rounded-xl border border-stone-800">
      <span class="text-sm font-bold">Cave à vin</span>
      <div class="flex gap-2">
        <button onclick="openScanner('cave')" class="bg-stone-800 text-amber-400 border border-stone-700 px-3 py-2 rounded-lg text-xs">📷 Scanner</button>
        <button onclick="openModal('cave')" class="bg-amber-600 text-stone-950 px-3 py-2 rounded-lg text-xs font-bold">+ Vin</button>
      </div>
    </div>
    <div class="grid grid-cols-4 gap-2 text-center text-[11px]">
      <button onclick="mat='all';render()" class="bg-stone-900 border border-stone-800 rounded-lg p-2">Total<div class="text-lg font-bold" id="s-all">0</div></button>
      <button onclick="mat='apogee';render()" class="bg-emerald-950/40 border border-emerald-900 rounded-lg p-2 text-emerald-300">Apogée<div class="text-lg font-bold" id="s-apogee">0</div></button>
      <button onclick="mat='bientot';render()" class="bg-amber-950/40 border border-amber-900 rounded-lg p-2 text-amber-300">À boire vite<div class="text-lg font-bold" id="s-bientot">0</div></button>
      <button onclick="mat='garder';render()" class="bg-blue-950/40 border border-blue-900 rounded-lg p-2 text-blue-300">À garder<div class="text-lg font-bold" id="s-garder">0</div></button>
    </div>
    <div id="cave-list" class="grid sm:grid-cols-2 gap-3"></div>
  </section>

  <section id="t-repas" class="tab space-y-3">
    <div class="owner bg-stone-900 p-4 rounded-xl border border-stone-800 space-y-3">
      <input id="r-titre" oninput="saveRepas()" placeholder="Plat du repas (ex : Daube provençale)" class="w-full bg-stone-950 border border-stone-800 rounded-lg p-2.5 text-sm">
      <select id="r-vin" onchange="saveRepas()" class="w-full bg-stone-950 border border-stone-800 rounded-lg p-2.5 text-sm"></select>
    </div>
    <div class="bg-stone-900 p-4 rounded-xl border border-stone-800 text-center space-y-2">
      <div class="text-xs text-amber-500 uppercase tracking-wider">Au menu ce soir</div>
      <p id="p-titre" class="text-sm italic text-stone-300"></p>
      <div id="p-vin" class="text-sm text-amber-400"></div>
    </div>
  </section>

  <section id="t-qr" class="tab space-y-3 text-center">
    <div class="owner bg-stone-900 p-5 rounded-2xl border border-stone-800 space-y-3">
      <p class="text-xs text-stone-400">Faites scanner ce QR code, ou passez votre téléphone en « Mode Invité » pour que vos convives choisissent leur verre.</p>
      <div class="bg-white p-3 rounded-xl inline-block"><div id="qrcode"></div></div>
      <div id="link" class="text-xs text-stone-400 break-all bg-stone-950 p-2 rounded border border-stone-800"></div>
      <button onclick="copyLink()" class="w-full bg-amber-600 text-stone-950 font-bold py-2.5 rounded-xl text-xs">Copier le lien</button>
    </div>
    <div class="bg-stone-900 p-4 rounded-xl border border-stone-800 text-left space-y-2">
      <div class="flex justify-between"><span class="text-sm font-bold">🔔 Commandes</span><button onclick="orders=[];save();render()" class="owner text-xs text-stone-400">Vider</button></div>
      <div id="orders"></div>
    </div>
  </section>
</main>

<div id="modal" class="fixed inset-0 bg-stone-950/80 z-50 hidden items-center justify-center p-4">
  <div class="bg-stone-900 border border-stone-800 w-full max-w-md rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between mb-3"><h3 id="m-title" class="font-bold text-sm"></h3><button onclick="closeModal()">✕</button></div>
    <div class="space-y-3 text-xs">
      <label class="block text-center bg-amber-600 text-stone-950 font-bold py-2.5 rounded-xl cursor-pointer">✨ Remplir avec l’IA depuis une photo de l’étiquette<input type="file" accept="image/*" class="hidden" onchange="aiFill(event)"></label>
      <p id="ai-msg" class="text-stone-400 text-center"></p>
      <input id="f-name" placeholder="Nom de la bouteille *" class="w-full bg-stone-950 border border-stone-800 rounded-lg p-2.5">
      <div class="grid grid-cols-2 gap-2">
        <select id="f-cat" class="bg-stone-950 border border-stone-800 rounded-lg p-2.5"></select>
        <input id="f-qty" type="number" min="1" value="1" class="bg-stone-950 border border-stone-800 rounded-lg p-2.5" placeholder="Quantité">
      </div>
      <div id="f-wine" class="space-y-3 border-t border-stone-800 pt-3">
        <div class="grid grid-cols-2 gap-2">
          <input id="f-year" type="number" placeholder="Millésime" class="bg-stone-950 border border-stone-800 rounded-lg p-2.5">
          <input id="f-region" placeholder="Région (Bordeaux…)" class="bg-stone-950 border border-stone-800 rounded-lg p-2.5">
        </div>
        <button onclick="estimate()" class="w-full bg-amber-600/20 text-amber-400 border border-amber-500/30 py-2 rounded-lg">✨ Estimer l’apogée automatiquement</button>
        <div class="grid grid-cols-2 gap-2">
          <input id="f-a1" type="number" placeholder="Début apogée" class="bg-stone-950 border border-stone-800 rounded-lg p-2.5">
          <input id="f-a2" type="number" placeholder="Fin apogée" class="bg-stone-950 border border-stone-800 rounded-lg p-2.5">
        </div>
      </div>
      <textarea id="f-notes" rows="2" placeholder="Notes, origine, code-barres…" class="w-full bg-stone-950 border border-stone-800 rounded-lg p-2.5"></textarea>
      <input id="f-file" type="file" accept="image/*" class="w-full text-stone-400">
      <div class="flex gap-2">
        <button onclick="closeModal()" class="flex-1 bg-stone-800 py-2.5 rounded-xl">Annuler</button>
        <button onclick="saveBottle()" class="flex-1 bg-amber-600 text-stone-950 font-bold py-2.5 rounded-xl">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<div id="scanner" class="fixed inset-0 bg-stone-950/95 z-50 hidden flex-col items-center justify-center p-4 gap-3">
  <div class="flex justify-between w-full max-w-md"><b class="text-sm">Scanner un code-barres</b><button onclick="stopScan()">✕</button></div>
  <div id="interactive" class="relative w-full max-w-md aspect-[4/3] bg-stone-900 rounded-2xl overflow-hidden"></div>
  <p id="scan-msg" class="text-xs text-stone-400 text-center">Visez le code-barres.</p>
  <label class="bg-amber-600 text-stone-950 font-bold text-xs px-4 py-2.5 rounded-xl cursor-pointer">📸 Prendre une photo du code-barres<input type="file" accept="image/*" capture="environment" class="hidden" onchange="decodePhoto(event)"></label>
  <button onclick="stopScan();openModal(scanType)" class="text-xs text-stone-400 underline">Ajouter sans scanner</button>
</div>

<script>
const BAR_CATS=['Rhum','Whisky','Liqueur','Vodka/Gin','Autre'],WINE_CATS=['Rouge','Blanc','Rosé','Champagne','Autre'];
const $=id=>document.getElementById(id),Y=new Date().getFullYear();
let items=[],orders=[],repas={titre:'',vin:''},guest=false,mat='all',barCat='all',editId=null,modalType='bar',scanType='bar';
try{const d=JSON.parse(localStorage.getItem('barcave')||'{}');items=d.items||[];orders=d.orders||[];repas=d.repas||repas}catch(e){}
function save(){try{localStorage.setItem('barcave',JSON.stringify({items,orders,repas}))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tab(t){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('on'));$('t-'+t).classList.add('on');
 ['bar','cave','repas','qr'].forEach(x=>$('n-'+x).className='py-2 px-3 '+(x==t?'text-amber-500 font-semibold border-b-2 border-amber-500':'text-stone-400'));}
function toggleMode(){guest=!guest;document.body.classList.toggle('guest',guest);$('mode-btn').textContent=guest?'👋 Mode Invité (appuyer pour quitter)':'🛡️ Propriétaire';render()}

function status(b){if(!b.a1||!b.a2)return null;if(Y<b.a1)return'garder';if(Y>=b.a2-1)return'bientot';return'apogee'}
const BADGE={apogee:['🍷 À l’apogée','bg-emerald-900/50 text-emerald-300'],bientot:['⚠️ À boire vite','bg-amber-900/50 text-amber-300'],garder:['⏳ À garder','bg-blue-900/50 text-blue-300']};

function card(b){
 const s=b.type=='cave'?status(b):null;
 return `<div class="bg-stone-900 border border-stone-800 rounded-xl p-3 flex gap-3">
 ${b.img?`<img src="${b.img}" class="w-16 h-20 object-cover rounded-lg">`:`<div class="w-16 h-20 bg-stone-800 rounded-lg flex items-center justify-center text-2xl">${b.type=='cave'?'🍷':'🥃'}</div>`}
 <div class="flex-1 min-w-0 space-y-1">
  <div class="font-semibold text-sm">${esc(b.name)}</div>
  <div class="text-xs text-stone-400">${esc(b.cat)}${b.year?' · '+esc(b.year):''}${b.region?' · '+esc(b.region):''} · ×${b.qty}</div>
  ${s?`<span class="text-[11px] px-2 py-0.5 rounded-full ${BADGE[s][1]}">${BADGE[s][0]} (${b.a1}–${b.a2})</span>`:''}
  ${b.notes?`<div class="text-xs text-stone-500">${esc(b.notes)}</div>`:''}
  <div class="flex gap-2 pt-1">
   ${guest?`<button onclick="order('${b.id}')" class="bg-amber-600 text-stone-950 text-xs font-bold px-3 py-1.5 rounded-lg">Je le veux !</button>`
   :`<button onclick="openModal('${b.type}','${b.id}')" class="text-xs bg-stone-800 px-2 py-1 rounded">Modifier</button>
     <button onclick="chg('${b.id}',-1)" class="text-xs bg-stone-800 px-2 py-1 rounded">−1</button>
     <button onclick="chg('${b.id}',1)" class="text-xs bg-stone-800 px-2 py-1 rounded">+1</button>
     <button onclick="del('${b.id}')" class="text-xs text-red-400 px-2 py-1">Suppr.</button>`}
  </div></div></div>`;
}
function render(){
 const bars=items.filter(b=>b.type=='bar'),wines=items.filter(b=>b.type=='cave');
 $('bar-filters').innerHTML=['all',...BAR_CATS].map(c=>`<button onclick="barCat='${c}';render()" class="px-3 py-1.5 rounded-full whitespace-nowrap ${barCat==c?'bg-amber-600 text-stone-950':'bg-stone-900 border border-stone-800 text-stone-300'}">${c=='all'?'Tous':c}</button>`).join('');
 const bl=bars.filter(b=>barCat=='all'||b.cat==barCat);
 $('bar-list').innerHTML=bl.map(card).join('')||'<p class="text-xs text-stone-500 italic">Rien pour l’instant.</p>';
 ['apogee','bientot','garder'].forEach(k=>$('s-'+k).textContent=wines.filter(w=>status(w)==k).length);$('s-all').textContent=wines.length;
 const wl=wines.filter(w=>mat=='all'||status(w)==mat);
 $('cave-list').innerHTML=wl.map(card).join('')||'<p class="text-xs text-stone-500 italic">Aucun vin.</p>';
 $('r-vin').innerHTML='<option value="">-- Vin du repas --</option>'+wines.map(w=>`<option value="${w.id}" ${repas.vin==w.id?'selected':''}>${esc(w.name)} ${esc(w.year||'')}</option>`).join('');
 $('r-titre').value=repas.titre||'';
 const w=wines.find(x=>x.id==repas.vin);
 $('p-titre').textContent=repas.titre||'Aucun menu défini pour l’instant.';
 $('p-vin').textContent=w?`🍷 Vin conseillé : ${w.name}${w.year?' '+w.year:''}`:'';
 $('orders').innerHTML=orders.map(o=>`<div class="flex justify-between text-xs bg-stone-950 border border-stone-800 rounded-lg p-2"><span><b>${esc(o.guest)}</b> : ${esc(o.name)}</span><span class="text-stone-500">${esc(o.time)} <button class="owner text-emerald-400 ml-2" onclick="orders=orders.filter(x=>x.id!='${o.id}');save();render()">✓ servi</button></span></div>`).join('')||'<p class="text-xs text-stone-500 italic">Aucune commande.</p>';
}
function saveRepas(){repas={titre:$('r-titre').value,vin:$('r-vin').value};save();const w=items.find(x=>x.id==repas.vin);$('p-titre').textContent=repas.titre||'Aucun menu défini pour l’instant.';$('p-vin').textContent=w?`🍷 Vin conseillé : ${w.name}${w.year?' '+w.year:''}`:''}
function order(id){const b=items.find(x=>x.id==id),g=$('guest-name').value.trim()||'Invité';
 orders.unshift({id:'o'+Date.now(),guest:g,name:b.name,time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});save();render();alert('Commande envoyée : '+b.name+' 🥂')}
function chg(id,d){const b=items.find(x=>x.id==id);b.qty=Math.max(0,b.qty+d);if(b.qty==0&&confirm('Plus de bouteille. La supprimer ?'))items=items.filter(x=>x.id!=id);save();render()}
function del(id){if(confirm('Supprimer cette bouteille ?')){items=items.filter(x=>x.id!=id);save();render()}}

let img='';
function openModal(type,id){modalType=type;editId=id||null;img='';
 const b=id?items.find(x=>x.id==id):{};
 $('m-title').textContent=id?'Modifier':(type=='cave'?'Ajouter un vin':'Ajouter une bouteille');
 $('f-cat').innerHTML=(type=='cave'?WINE_CATS:BAR_CATS).map(c=>`<option ${b.cat==c?'selected':''}>${c}</option>`).join('');
 $('f-wine').style.display=type=='cave'?'block':'none';
 $('f-name').value=b.name||'';$('f-qty').value=b.qty||1;$('f-year').value=b.year||'';$('f-region').value=b.region||'';
 $('f-a1').value=b.a1||'';$('f-a2').value=b.a2||'';$('f-notes').value=b.notes||'';$('f-file').value='';img=b.img||'';
 $('ai-msg').textContent='';$('modal').classList.replace('hidden','flex')}
function closeModal(){$('modal').classList.replace('flex','hidden')}
$('f-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,320/Math.max(i.width,i.height));c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.7)};i.src=r.result};r.readAsDataURL(f)};
function estimate(){const y=+$('f-year').value;if(!y){alert('Indiquez le millésime.');return}
 const r=$('f-region').value.toLowerCase(),c=$('f-cat').value;
 let [a,b]=[3,8];
 if(/champagne/.test(r)||c=='Champagne')[a,b]=[3,10];
 else if(/bordeaux|médoc|medoc|pauillac|margaux|saint-émilion|pomerol/.test(r))[a,b]=[8,25];
 else if(/bourgogne|burgundy|côte|nuits|beaune/.test(r))[a,b]=[5,15];
 else if(/rhône|rhone|châteauneuf|hermitage/.test(r))[a,b]=[5,18];
 else if(/loire|alsace/.test(r)||c=='Blanc')[a,b]=[2,8];
 else if(c=='Rosé')[a,b]=[1,3];
 $('f-a1').value=y+a;$('f-a2').value=y+b}
function shrink(f,max){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c)};i.onerror=rej;i.src=URL.createObjectURL(f)})}
async function aiFill(e){const f=e.target.files[0];if(!f)return;const st=$('ai-msg');st.textContent='Analyse de l’étiquette…';
 try{const sample=await claude.use('sample');if(!sample){st.textContent='Fonction indisponible ici : ouvrez le lien depuis claude.ai.';return}
  const cv=await shrink(f,1024),blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.8)),cats=modalType=='cave'?WINE_CATS:BAR_CATS;
  const r=await sample.json(`Tu es sommelier et expert en spiritueux. Voici la photo d’une étiquette de bouteille. Réponds uniquement avec un objet JSON ayant ces clés : name (nom complet sans millésime), category (exactement l’une de : ${cats.join(', ')}), year (millésime en nombre, sinon null), region (région ou appellation, sinon pays), notes (1 à 2 phrases en français : type ou cépages, degré d’alcool si visible, profil de dégustation), apogee_start et apogee_end (années, seulement pour un vin, sinon null). Si une information n’est pas lisible ou si tu n’es pas sûr, mets null au lieu d’inventer.`,{images:[blob]});
  if(r.name)$('f-name').value=r.name;
  if(cats.includes(r.category))$('f-cat').value=r.category;
  if(modalType=='cave'){if(r.year)$('f-year').value=r.year;if(r.region)$('f-region').value=r.region;
   if(r.apogee_start&&r.apogee_end){$('f-a1').value=r.apogee_start;$('f-a2').value=r.apogee_end}else if(r.year)estimate()}
  else if(r.region)r.notes=[r.region,r.notes].filter(Boolean).join(' · ');
  if(r.notes)$('f-notes').value=[$('f-notes').value,r.notes].filter(Boolean).join('\n');
  if(!img)img=(await shrink(f,320)).toDataURL('image/jpeg',.7);
  st.textContent='✅ Informations remplies. Vérifiez avant d’enregistrer.';
 }catch(x){st.textContent='Impossible d’analyser la photo. Réessayez avec une étiquette bien nette.'}}
function saveBottle(){const name=$('f-name').value.trim();if(!name){alert('Le nom est requis.');return}
 const b={id:editId||'b'+Date.now(),type:modalType,name,cat:$('f-cat').value,qty:Math.max(1,+$('f-qty').value||1),
  year:$('f-year').value,region:$('f-region').value,a1:+$('f-a1').value||0,a2:+$('f-a2').value||0,notes:$('f-notes').value,img};
 if(editId)items=items.map(x=>x.id==editId?b:x);else items.push(b);save();closeModal();render()}

function openScanner(t){scanType=t;$('scanner').classList.replace('hidden','flex');
 if(!window.Quagga){$('scan-msg').textContent='Scanner indisponible.';return}
 Quagga.init({inputStream:{type:'LiveStream',target:$('interactive'),constraints:{facingMode:'environment'}},decoder:{readers:['ean_reader','ean_8_reader','upc_reader','code_128_reader']}},err=>{
  if(err){$('scan-msg').textContent='Caméra en direct bloquée : utilisez le bouton photo ci-dessous.';return}Quagga.start()});
 Quagga.offDetected();Quagga.onDetected(r=>{const code=r.codeResult.code;stopScan();openModal(scanType);$('f-notes').value='Code-barres : '+code})}
async function decodePhoto(e){const f=e.target.files[0];if(!f)return;$('scan-msg').textContent='Analyse…';
 const ok=c=>{stopScan();openModal(scanType);$('f-notes').value='Code-barres : '+c};
 try{if('BarcodeDetector' in window){const r=await new BarcodeDetector().detect(await createImageBitmap(f));if(r.length){ok(r[0].rawValue);return}}}catch(x){}
 const sizes=[1280,1920,800];let i=0;
 const go=()=>Quagga.decodeSingle({src:URL.createObjectURL(f),numOfWorkers:0,locate:true,inputStream:{size:sizes[i]},decoder:{readers:['ean_reader','ean_8_reader','upc_reader','code_128_reader','code_39_reader']}},r=>{
  if(r&&r.codeResult)ok(r.codeResult.code);else if(++i<sizes.length)go();else $('scan-msg').textContent='Code non lu. Essayez une autre face de la bouteille, ou ajoutez-la sans scanner.'});
 go()}
function decodePhotoOld(e){const f=e.target.files[0];if(!f)return;$('scan-msg').textContent='Analyse…';
 Quagga.decodeSingle({src:URL.createObjectURL(f),numOfWorkers:0,locate:true,inputStream:{size:1280},decoder:{readers:['ean_reader','ean_8_reader','upc_reader','code_128_reader']}},r=>{
  if(r&&r.codeResult){const c=r.codeResult.code;stopScan();openModal(scanType);$('f-notes').value='Code-barres : '+c}
  else $('scan-msg').textContent='Code non lu. Rapprochez-vous, bien net et bien éclairé, puis réessayez.'})}
function stopScan(){try{Quagga.stop()}catch(e){}$('scanner').classList.replace('flex','hidden')}

function copyLink(){const u=location.href.split('#')[0];(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert('Lien copié !')).catch(()=>prompt('Copiez ce lien :',u))}
const url=location.href.split('#')[0];$('link').textContent=url;
try{new QRCode($('qrcode'),{text:url,width:160,height:160})}catch(e){}
tab('bar');render();
</script>
